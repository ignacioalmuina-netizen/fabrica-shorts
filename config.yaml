# ============================================================
#  FÁBRICA DE SHORTS — configuración
#  Todo lo que se puede cambiar sin tocar código está aquí.
# ============================================================

# Los 4 canales (Vice Intel, Odd Atlas, Bone Logic, Lost Files), sus formatos,
# estética, voces y reglas están en canales.yaml. Esto es la configuración común.
canal:
  nombre: "Fábrica de Shorts"
  # Nicho generalista: el cazador de tendencias elige el tema que más
  # esté funcionando AHORA, sea del tema que sea.
  nicho: "generalista"
  descripcion_nicho: >-
    Curiosidades virales de cualquier tema: ciencia, cuerpo humano, psicología,
    historia, animales, espacio, tecnología, dinero, comida, récords.
  # Temas que NUNCA se tocan aunque estén petando
  temas_prohibidos:
    - política partidista
    - tragedias o muertes recientes
    - consejos médicos o financieros personalizados
    - apuestas y criptoestafas
    - contenido para niños
  dias_sin_repetir_tema: 60     # no repetir un tema usado en los últimos N días

# ------------------------------------------------------------
#  Idiomas y mercados
#  modo: rotar -> alterna los idiomas de "orden" en cada tirada
#        es / en -> siempre ese idioma
# ------------------------------------------------------------
idiomas:
  modo: rotar
  orden: [es, en]
  es:
    nombre: "Español (España + Latinoamérica)"
    relevance_language: es
    regiones: [ES, MX, AR, CO]  # cada región = 1 search.list = 100 unidades de cuota
    estilo: >-
      Español neutro que se entienda igual en España y Latinoamérica.
      Tuteo (tú), nada de "vosotros" ni modismos locales (guay, chévere, che...).
    voz:
      elevenlabs_voice_id: "18GZPpJvaVG53Nt3H52N"   # "SAM ADAM": enérgica, latina neutra, para curiosidades
      edge: "es-MX-JorgeNeural"                       # alternativa gratis
  en:
    nombre: "English (global)"
    relevance_language: en
    regiones: [US, GB]
    estilo: "Plain, punchy global English. Avoid region-specific slang."
    voz:
      elevenlabs_voice_id: "pNInz6obpgDQGcFmaJgB"
      edge: "en-US-AndrewNeural"

# ------------------------------------------------------------
#  1. Cazador de tendencias (YouTube Data API v3)
#  Cuota gratis: 10.000 unidades/día. search.list = 100, videos.list y
#  channels.list = 1 por llamada (hasta 50 ids).
#  Coste por tirada = consultas x regiones x 100 (+ unas pocas unidades)
# ------------------------------------------------------------
tendencias:
  dias: 7                       # publishedAfter = hace N días
  max_duracion_s: 180           # Shorts de hasta 3 minutos
  consultas: ["#shorts"]        # términos de búsqueda (nicho generalista)
  resultados_por_busqueda: 50   # máximo que permite la API
  usar_mas_populares: true      # además, videos.list chart=mostPopular (1 unidad)
  cache_horas: 6                # reutiliza la búsqueda si es reciente (ahorra cuota en x3)
  top_candidatos: 25            # cuántos candidatos ve el agente

# ------------------------------------------------------------
#  2. Guion
# ------------------------------------------------------------
guion:
  duracion_min_s: 20
  duracion_max_s: 45
  duracion_ideal_s: [25, 35]
  escenas_min: 7
  escenas_max: 18              # 1 escena = 1 plano = 1 frase corta (cortes cada ~2 s)
  palabras_por_segundo: 2.5    # ya con el 1.08x (prudente: los números leídos alargan)
  max_palabras_gancho: 9
  ganchos_prohibidos:
    - "hola"
    - "¿sabías que"
    - "sabías que"
    - "en este vídeo"
    - "en este video"
    - "hoy te voy a"
    - "hoy vamos a"
    - "bienvenidos"
    - "hey guys"
    - "did you know"
    - "in this video"
    - "welcome"

# ------------------------------------------------------------
#  3. Voz
# ------------------------------------------------------------
voz:
  proveedor: elevenlabs         # elevenlabs | edge
  respaldo_edge: true           # si ElevenLabs falla o no hay clave, usa edge-tts (gratis, voz neuronal)
  velocidad: 1.08               # atempo
  lufs: -14
  edge_rate: "+6%"              # velocidad extra en edge-tts antes del atempo
  elevenlabs:
    modelo: eleven_multilingual_v2
    stability: 0.32             # más bajo = más expresiva
    similarity_boost: 0.8
    style: 0.5
    speaker_boost: true

# ------------------------------------------------------------
#  4. Material visual
#  proveedor: ia      -> una imagen IA por plano con el estilo del formato (RECOMENDADO)
#             pexels  -> vídeo de stock vertical
#             mixto   -> Pexels primero; si no encaja, imagen IA
#  ia:        auto       -> Cloudflare si hay CLOUDFLARE_ACCOUNT_ID (GRATIS), si no OpenAI
#             cloudflare -> Workers AI / Flux, gratis ~80-90 imágenes al día
#             openai     -> gpt-image, de pago (~0,04 $/imagen), la mejor calidad
#  También puedes generar fuera (p. ej. ElevenLabs) e importar:
#    python scripts/escenas.py runs/X --escena N --importar imagen.png
# ------------------------------------------------------------
visual:
  proveedor: ia
  ia: auto
  cloudflare:
    modelo: "@cf/black-forest-labs/flux-1-schnell"
    pasos: 8                    # 1-8: más pasos = más calidad y más neuronas
    # ancho: 768               # solo para modelos que lo admitan (flux-1-schnell saca 1024x1024)
    # alto: 1344
  pexels:
    resultados: 15
    min_altura: 1280
    no_repetir_en_ultimas_tiradas: 20
  openai:
    modelo: gpt-image-1
    tamano: 1024x1536
    calidad: high               # low | medium | high
  max_reintentos_por_escena: 3

# ------------------------------------------------------------
#  5. Montaje
# ------------------------------------------------------------
video:
  ancho: 1080
  alto: 1920
  fps: 30
  crf: 18
  preset: medium
  intensidad_movimiento: 1.0    # 0.5 suave · 1 normal · 1.5 agresivo
  vineta: 0.45                  # oscurecer bordes (0-1)
  barra_progreso: true
  grado_color: "eq=contrast=1.06:saturation=1.18,unsharp=5:5:0.6"
  cola_final_s: 0.35

gancho_pantalla:                # la pregunta en grande durante la primera escena
  activo: true
  tamano: 150
  color_caja: "#FFE600"
  color_texto: "#000000"
  posicion_y: 330

efectos_sonido:                 # whoosh en cortes, boom en golpes, pop, tic-tac (assets/sfx/)
  activo: true
  volumen: 0.5

subtitulos:
  fuente: "Anton"               # fichero en assets/fonts/
  tamano: 175                   # Anton en libass: 175 ≈ letras de 75 px
  color: "#FFFFFF"
  color_activo: "#FFE600"       # la palabra que suena
  color_borde: "#000000"
  borde: 10
  sombra: 5
  palabras_por_linea: 2         # 1-3; 2 = ritmo rápido tipo Shorts
  max_caracteres_linea: 14
  posicion_y: 1230
  mayusculas: true

musica:
  carpeta: assets/music
  volumen: 0.12

# ------------------------------------------------------------
#  6. Miniaturas
# ------------------------------------------------------------
miniaturas:
  cantidad: 10
  max_palabras: 4
  max_mb: 2
  tamano_movil: [180, 320]      # tamaño aprox. en que se ve en el feed del móvil

# ------------------------------------------------------------
#  7. Publicación
#  modo: navegador -> sube desde YouTube Studio con Claude in Chrome (POR DEFECTO)
#        api       -> YouTube Data API (solo con proyecto de Google Cloud AUDITADO)
#        manual    -> deja el paquete listo en 07_paquete/ y lo subes tú
# ------------------------------------------------------------
publicacion:
  modo: navegador
  privacidad: public            # public | unlisted | private
  proyecto_auditado: false      # pon true cuando Google apruebe la auditoría de la API
  made_for_kids: false
  contiene_contenido_sintetico: auto   # auto = true si alguna escena usa imagen IA realista
  categoria_id: "24"            # 24 Entretenimiento, 27 Educación, 28 Ciencia y tecnología
  hashtags_fijos: ["#shorts"]
  max_tags: 15
  esperar_procesado_min: 15     # minutos máx. esperando a que YouTube procese antes de thumbnails.set

# ------------------------------------------------------------
#  Automatización (tarea programada diaria)
# ------------------------------------------------------------
automatizacion:
  shorts_por_tirada: 3          # cuántos Shorts hace cada vez que se lanza sin número
